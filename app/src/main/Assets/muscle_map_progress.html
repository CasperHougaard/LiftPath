<!DOCTYPE html>
<!--
    MUSCLE MAP PROGRESS DISPLAY
    Shows muscles colored by progress percentage
-->
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: #1a1a2e;
            box-sizing: border-box;
        }
        * {
            box-sizing: border-box;
        }
        #svg-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        svg {
            display: block;
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
            margin: 0 auto;
            flex-shrink: 0;
            object-fit: contain;
        }

        /* DEFAULT STATE: Dark Grey with White Outline */
        path:not([id*="_overlay"]) {
            fill: #444444 !important;
            stroke: #ffffff !important;
            stroke-width: 2px !important;
            transition: fill 0.3s ease;
        }

        use {
            fill: #444444 !important;
            fill-opacity: 1.0 !important;
            stroke: #ffffff !important;
            stroke-width: 2px !important;
            transition: fill 0.3s ease;
        }
        
        [id*="_overlay"] {
            transition: fill 0.3s ease, fill-opacity 0.3s ease;
        }
        
        ellipse:not([id*="_overlay"]) {
            fill: #444444 !important;
            stroke: #ffffff !important;
            stroke-width: 2px !important;
            transition: fill 0.3s ease;
        }
        
        #error-message {
            color: #ff6b6b;
            text-align: center;
            padding: 20px;
            display: none;
        }
    </style>
</head>
<body>
    <div id="svg-container"></div>
    <div id="error-message"></div>

    <script>
        console.log('Muscle map progress loading...');
        
        // Load the SVG immediately using fetch
        fetch('liftpath_musclegroups.svg')
            .then(response => {
                console.log('Fetch response status:', response.status);
                if (!response.ok) {
                    throw new Error('SVG fetch failed: ' + response.status);
                }
                return response.text();
            })
            .then(svgText => {
                console.log('SVG loaded, length:', svgText.length);
                const container = document.getElementById('svg-container');
                container.innerHTML = svgText;
                
                const svg = container.querySelector('svg');
                if (svg) {
                    svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
                    svg.setAttribute('width', '100%');
                    svg.setAttribute('height', '100%');
                    
                    console.log('SVG injected successfully');
                    
                    // Log available IDs for debugging
                    const allIds = [];
                    document.querySelectorAll('[id]').forEach(el => {
                        if (!el.id.startsWith('_Image') && el.id !== 'svg-container' && el.id !== 'error-message') {
                            allIds.push(el.id);
                        }
                    });
                    console.log('Available muscle IDs:', allIds.length, allIds.slice(0, 10).join(', ') + '...');
                    
                    // Initialize overlays
                    initializeMuscleOverlays(svg);
                } else {
                    console.error('SVG element not found in loaded content');
                    showError('SVG element not found');
                }
            })
            .catch(err => {
                console.error('Fetch failed, trying XMLHttpRequest:', err);
                // Fallback to XMLHttpRequest
                const xhr = new XMLHttpRequest();
                xhr.open('GET', 'liftpath_musclegroups.svg', true);
                xhr.onreadystatechange = function() {
                    if (xhr.readyState === 4) {
                        if (xhr.status === 200 || xhr.status === 0) {
                            console.log('XMLHttpRequest succeeded');
                            const container = document.getElementById('svg-container');
                            container.innerHTML = xhr.responseText;
                            const svg = container.querySelector('svg');
                            if (svg) {
                                svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
                                svg.setAttribute('width', '100%');
                                svg.setAttribute('height', '100%');
                                initializeMuscleOverlays(svg);
                            }
                        } else {
                            console.error('XMLHttpRequest also failed:', xhr.status);
                            showError('Failed to load SVG');
                        }
                    }
                };
                xhr.send(null);
            });

        function showError(msg) {
            document.getElementById('error-message').innerText = msg;
            document.getElementById('error-message').style.display = 'block';
        }

        function initializeMuscleOverlays(svg) {
            if (!svg) {
                console.error('No SVG provided to initializeMuscleOverlays');
                return;
            }
            
            const doc = svg.ownerDocument || document;
            let overlayCount = 0;
            
            doc.querySelectorAll('[id]').forEach(el => {
                const id = el.id;
                // Skip overlays, images, and container IDs
                if (id.endsWith('_overlay') || id.startsWith('_Image') || 
                    id === 'svg-container' || id === 'error-message') {
                    return;
                }
                
                const overlayId = id + '_overlay';
                
                // Only create if overlay doesn't exist
                if (!doc.getElementById(overlayId)) {
                    const overlay = createMuscleOverlay(el, '#444444', doc);
                    if (overlay && el.parentNode) {
                        const nextSibling = el.nextSibling;
                        if (nextSibling) {
                            el.parentNode.insertBefore(overlay, nextSibling);
                        } else {
                            el.parentNode.appendChild(overlay);
                        }
                        overlayCount++;
                    }
                }
            });
            
            console.log('Created', overlayCount, 'overlays');
            window.muscleMapReady = true;
        }

        function createMuscleOverlay(muscleElement, overlayColor, doc) {
            const id = muscleElement.id;
            if (!id) return null;
            
            const overlayId = id + '_overlay';
            const tagName = muscleElement.tagName.toLowerCase();
            let overlay;
            
            if (tagName === 'ellipse') {
                overlay = doc.createElementNS('http://www.w3.org/2000/svg', 'ellipse');
                overlay.setAttribute('cx', muscleElement.getAttribute('cx') || '0');
                overlay.setAttribute('cy', muscleElement.getAttribute('cy') || '0');
                overlay.setAttribute('rx', muscleElement.getAttribute('rx') || '50');
                overlay.setAttribute('ry', muscleElement.getAttribute('ry') || '50');
            } else if (tagName === 'circle') {
                overlay = doc.createElementNS('http://www.w3.org/2000/svg', 'circle');
                overlay.setAttribute('cx', muscleElement.getAttribute('cx') || '0');
                overlay.setAttribute('cy', muscleElement.getAttribute('cy') || '0');
                overlay.setAttribute('r', muscleElement.getAttribute('r') || '50');
            } else if (tagName === 'path') {
                overlay = muscleElement.cloneNode(false);
                overlay.removeAttribute('id');
                overlay.removeAttributeNS('http://www.serif.com/', 'id');
                overlay.removeAttribute('serif:id');
                overlay.removeAttribute('fill');
                overlay.removeAttribute('style');
            } else if (tagName === 'rect') {
                overlay = doc.createElementNS('http://www.w3.org/2000/svg', 'rect');
                overlay.setAttribute('x', muscleElement.getAttribute('x') || '0');
                overlay.setAttribute('y', muscleElement.getAttribute('y') || '0');
                overlay.setAttribute('width', muscleElement.getAttribute('width') || '100');
                overlay.setAttribute('height', muscleElement.getAttribute('height') || '100');
            } else if (tagName === 'use') {
                try {
                    const bbox = muscleElement.getBBox();
                    overlay = doc.createElementNS('http://www.w3.org/2000/svg', 'rect');
                    overlay.setAttribute('x', bbox.x);
                    overlay.setAttribute('y', bbox.y);
                    overlay.setAttribute('width', bbox.width);
                    overlay.setAttribute('height', bbox.height);
                } catch (e) {
                    return null;
                }
            } else {
                return null;
            }
            
            // Copy transform if exists
            const transform = muscleElement.getAttribute('transform');
            if (transform) {
                overlay.setAttribute('transform', transform);
            }
            
            overlay.setAttribute('id', overlayId);
            overlay.setAttribute('fill', overlayColor);
            overlay.setAttribute('fill-opacity', '0.9');
            overlay.setAttribute('stroke', 'none');
            overlay.setAttribute('stroke-width', '0');
            overlay.setAttribute('pointer-events', 'none');
            
            return overlay;
        }

        // Called from Kotlin: setMuscleProgress(progressMap)
        // progressMap: { "CHEST_UPPER": 12.5, "QUADS": -5.2, "LATS": null }
        // null = first time (blue), positive = improved (green), negative = decreased (red)
        window.setMuscleProgress = function(progressMap) {
            console.log('=== setMuscleProgress START ===');
            console.log('Progress map:', JSON.stringify(progressMap));
            
            const doc = document;
            const svg = doc.querySelector('svg');
            if (!svg) {
                console.error('SVG not loaded yet');
                // Retry in 200ms
                setTimeout(() => window.setMuscleProgress(progressMap), 200);
                return 'RETRY: SVG not ready';
            }
            
            // Reset all overlays to gray first
            let resetCount = 0;
            doc.querySelectorAll('[id*="_overlay"]').forEach(overlay => {
                overlay.setAttribute('fill', '#444444');
                overlay.setAttribute('fill-opacity', '0.7');
                resetCount++;
            });
            console.log('Reset', resetCount, 'overlays to gray');
            
            // Apply progress colors
            let coloredCount = 0;
            for (const [muscleName, progress] of Object.entries(progressMap)) {
                const color = getProgressColor(progress);
                
                // Find all muscle elements (handles duplicates/variants)
                const elements = findAllMuscleElements(muscleName, doc);
                
                elements.forEach((el, index) => {
                    const overlayId = el.id + '_overlay';
                    const overlay = doc.getElementById(overlayId);
                    
                    if (overlay) {
                        overlay.setAttribute('fill', color);
                        overlay.setAttribute('fill-opacity', '0.9');
                        overlay.style.setProperty('fill', color, 'important');
                        overlay.style.setProperty('fill-opacity', '0.9', 'important');
                        coloredCount++;
                        console.log('Colored', muscleName, 'with', color);
                    } else {
                        console.warn('Overlay not found for:', muscleName, '(tried:', overlayId + ')');
                    }
                });
            }
            
            console.log('Colored', coloredCount, 'muscles');
            console.log('=== setMuscleProgress END ===');
            
            // Force repaint
            svg.style.display = 'none';
            svg.offsetHeight;
            svg.style.display = '';
            
            return 'SUCCESS: colored ' + coloredCount + ' muscles';
        };

        function getProgressColor(progress) {
            if (progress === null || progress === undefined) {
                return '#60A5FA'; // Blue - first time
            } else if (progress > 5) {
                return '#10B981'; // Dark green - big improvement
            } else if (progress > 1) {
                return '#6EE7B7'; // Light green - small improvement
            } else if (progress < -5) {
                return '#EF4444'; // Red - big decrease
            } else if (progress < -1) {
                return '#FCA5A5'; // Light red - small decrease
            } else {
                return '#9CA3AF'; // Gray - stable
            }
        }

        function findAllMuscleElements(muscleName, doc) {
            const matches = [];
            doc.querySelectorAll('[id]').forEach(el => {
                if (el.id.endsWith('_overlay')) return;
                if (el.id === 'svg-container' || el.id === 'error-message') return;
                
                // Exact match
                if (el.id === muscleName) {
                    matches.push(el);
                } 
                // Numbered variants (e.g., CHEST_MIDDLE1, CHEST_MIDDLE2)
                else if (el.id.match(new RegExp('^' + muscleName + '\\d+$'))) {
                    matches.push(el);
                }
                // Check serif:id attribute
                const serifId = el.getAttributeNS('http://www.serif.com/', 'id') || 
                               el.getAttribute('serif:id');
                if (serifId === muscleName) {
                    matches.push(el);
                }
            });
            return matches;
        }
        
        console.log('Muscle map progress script loaded');
    </script>
</body>
</html>
